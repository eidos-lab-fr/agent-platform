name: Synchro du board (retiré)

# Le board GitHub Projects n'est plus utilisé : Agent HQ déduit le statut des labels et des PR.
# Ce workflow ne fait plus rien. Il reste seulement pour que les repos qui ont encore
# .github/workflows/agent-board.yml n'échouent pas. Supprime ce fichier quand plus aucun repo ne l'appelle
# (relancer « Onboarder un repo » retire agent-board.yml).

on:
  workflow_call:

jobs:
  retire:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: "true"
